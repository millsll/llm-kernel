[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# --- internal crate ---
llm-kernels = { path = "crates/llm-kernels" }
llm-kernels-flashinfer = { path = "crates/llm-kernels-flashinfer" }

thiserror = "2"
candle-core = { version = "0.11", features = ["cuda"] }
